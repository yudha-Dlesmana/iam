name: iam

services:
  app:
    build: .
    image: iam:prod
    container_name: iam_app
    restart: unless-stopped
    env_file:
      - runtime/.env
    volumes:
      - ./runtime/keys:/app/keys:ro
    ports:
      - "127.0.0.1:9001:9001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  
  migrate:
    build: .
    image: iam:prod
    env_file:
      - runtime/.env
    volumes:
      - ./runtime/keys:/app/keys:ro
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    profiles: ["tools"]

  mysql:
    image: mysql:8.0
    container_name: iam_mysql
    restart: unless-stopped
    env_file:
      - runtime/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: iam_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: iam_caddy
    restart: unless-stopped
    env_file:
      - runtime/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: iam_network