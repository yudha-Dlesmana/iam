name: CI

on:
  push:
    branches: [main, "development-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
  
    services:
      mysql:
        image: mysql:8.0
        env: 
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: starter_db_test
          MYSQL_USER: fastapi
          MYSQL_PASSWORD: qwe123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
        
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
      
    env:
      ENV: development
      DB_URL: mysql+aiomysql://fastapi:qwe123@127.0.0.1:3306/starter_db_test
      TEST_DB_URL: mysql+aiomysql://fastapi:qwe123@127.0.0.1:3306/starter_db_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_REFRESH_SECRET: ci-test-secret
      JWT_KEYS_DIR: keys
      JWT_ACTIVE_KID: iam-key-1
      JWT_ISSUER: iam
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Generate JWT keys
        run: make gen-keys
      
      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v